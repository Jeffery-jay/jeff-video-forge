name: Render video

on:
  push:
    paths:
      - 'script.json'
      - 'render.py'
      - 'footage/**'
      - 'fonts/**'
      - 'music.mp3'
      - 'MUSIC.md'
      - '.github/workflows/render.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ffmpeg and Python 3.11
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Render video
        run: python render.py

      - name: Upload final video artifact
        uses: actions/upload-artifact@v4
        with:
          name: mama-ada-kitchen-video
          path: output/final.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Send rendered video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram delivery skipped: add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request
          import uuid

          with open("script.json", encoding="utf-8") as f:
              script = json.load(f)
          hashtags = script.get("hashtags", [])
          caption = "\n\n".join([
              script.get("title", ""),
              script.get("caption", ""),
              " ".join(hashtags) if isinstance(hashtags, list) else str(hashtags),
          ])
          markup = json.dumps({"inline_keyboard": [[
              {"text": "APPROVE", "callback_data": "approve"},
              {"text": "REJECT", "callback_data": "reject"},
          ]]})

          boundary = "----FolkTelegram" + uuid.uuid4().hex
          parts = []
          def field(name, value):
              parts.append((
                  f"--{boundary}\r\n"
                  f'Content-Disposition: form-data; name="{name}"\r\n\r\n'
                  f"{value}\r\n"
              ).encode())
          field("chat_id", os.environ["TELEGRAM_CHAT_ID"])
          field("caption", caption)
          field("reply_markup", markup)
          with open("output/final.mp4", "rb") as video:
              parts.extend([
                  (f"--{boundary}\r\n"
                   'Content-Disposition: form-data; name="video"; filename="final.mp4"\r\n'
                   "Content-Type: video/mp4\r\n\r\n").encode(),
                  video.read(),
                  b"\r\n",
              ])
          parts.append(f"--{boundary}--\r\n".encode())
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendVideo",
              data=b"".join(parts),
              headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              result = json.load(response)
          if not result.get("ok"):
              raise RuntimeError("Telegram sendVideo returned ok=false")
          print("Telegram accepted the rendered video.")
          PY
