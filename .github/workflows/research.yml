name: Weekly trend research

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

# Monday 07:00 UTC. Outputs committed by research.py using the workflow token.
permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pytrends

      - name: Run trend research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python research.py

      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- trends/ draft-script.json
          if git diff --cached --quiet; then
            echo "No research files changed."
          else
            git commit -m "Add weekly trend research"
            git push
          fi
